<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pine</title>
<meta name="description" content="pine: agents that are woken by events, and that you chat and write code with.">
<style>
	:root { color-scheme: light dark; --bg: #f3f4f1; --text: #1a1d1b; --muted: #666e68; --brand: #1f7a55; }
	@media (prefers-color-scheme: dark) { :root { --bg: #1b1e28; --text: #e4f0fb; --muted: #a6accd; --brand: #5de4c7; } }
	html, body { height: 100%; margin: 0; }
	body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
	main { text-align: center; padding: 24px; }
	svg { width: min(320px, 60vw); height: auto; }
	h1 { margin: 40px 0 8px; font-size: 28px; letter-spacing: -0.02em; }
	p { margin: 0; color: var(--muted); }
	code { display: inline-block; margin-top: 28px; padding: 10px 16px; border-radius: 10px; background: color-mix(in srgb, var(--text) 7%, transparent); font: 15px ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); }
	a { color: var(--brand); }
</style>
</head>
